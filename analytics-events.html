<script type="text/plain" cookie-consent="tracking">
(() => {
  // Custom interaction events are only sent from the public website.
  if (!['muhittin.org', 'www.muhittin.org'].includes(window.location.hostname)) return;

  const language = document.documentElement.lang.startsWith('tr') ? 'tr' : 'en';
  const send = (name, parameters = {}) => {
    if (typeof window.gtag !== 'function') return;
    window.gtag('event', name, { site_language: language, ...parameters });
  };

  document.addEventListener('click', event => {
    const link = event.target.closest('a[href]');
    if (!link) return;
    const url = new URL(link.href, window.location.href);

    if (link.classList.contains('language-link')) {
      send('language_switch', { target_language: link.hreflang });
    } else if (link.closest('.navbar') && url.origin === window.location.origin) {
      send('navigation_click', { destination_path: url.pathname });
    }

    if (url.hostname === 'drive.google.com' && /\/(teaching|matematik-3)\.html$/.test(window.location.pathname)) {
      // Only send the public course label, without document IDs or URL parameters.
      send('course_material_click', { course_name: link.dataset.course || link.textContent.trim().slice(0, 100) });
    }

    if (url.protocol === 'mailto:') send('contact_click', { contact_method: 'email' });
  });

  const attachVideoEvents = () => {
    document.querySelectorAll('video.research-video').forEach(video => {
      let started = false;
      let completed = false;
      const milestones = new Set();
      const parameters = () => ({
        video_title: 'three_point_bending',
        video_provider: 'self_hosted',
        video_duration: Number.isFinite(video.duration) ? Math.round(video.duration) : 0,
      });

      video.addEventListener('play', () => {
        if (started) return;
        started = true;
        send('video_start', parameters());
      });

      const reportProgress = () => {
        if (!started || !Number.isFinite(video.duration) || video.duration <= 0) return;
        // Played ranges measure watched content, excluding skipped sections.
        let watched = 0;
        for (let index = 0; index < video.played.length; index++) {
          watched += video.played.end(index) - video.played.start(index);
        }
        const percent = Math.min(100, watched / video.duration * 100);
        [25, 50, 75].forEach(milestone => {
          if (percent >= milestone && !milestones.has(milestone)) {
            milestones.add(milestone);
            send('video_progress', { ...parameters(), video_percent: milestone });
          }
        });
        // Looping videos do not emit "ended"; watched ranges also handle that case.
        if (!completed && percent >= 99) {
          completed = true;
          send('video_complete', { ...parameters(), video_percent: 100 });
        }
      };
      video.addEventListener('timeupdate', reportProgress);
      video.addEventListener('ended', reportProgress);
    });
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', attachVideoEvents, { once: true });
  } else {
    attachVideoEvents();
  }
})();
</script>
