<script>
(() => {
  const links = Array.from(document.querySelectorAll('.navbar .nav-link'));
  const findLink = label => links.find(link => link.querySelector('.menu-text')?.textContent.trim() === label);
  const home = findLink('Home');
  const english = findLink('English');
  const turkish = findLink('Türkçe');
  if (!home || !english || !turkish) return;

  // Quarto resolves this link relative to the site, including subdirectory hosting.
  const root = new URL('.', home.href);
  const isTurkish = document.documentElement.lang.startsWith('tr');
  const pages = [
    ['Home', 'index.html', 'Ana Sayfa'],
    ['Publications', 'publications.html', 'Yayınlar'],
    ['Teaching', 'teaching.html', 'Dersler'],
    ['Simulations', 'simulations.html', 'Simülasyonlar'],
  ];
  const filename = window.location.pathname.split('/').pop() || 'index.html';
  const currentPage = pages.some(([, page]) => page === filename) ? filename : 'index.html';

  pages.forEach(([originalLabel, page, label]) => {
    const link = findLink(originalLabel);
    if (!link) return;
    link.href = new URL((isTurkish ? 'tr/' : '') + page, root).href;
    if (isTurkish) link.querySelector('.menu-text').textContent = label;
    const active = page === currentPage;
    link.classList.toggle('active', active);
    if (active) link.setAttribute('aria-current', 'page');
    else link.removeAttribute('aria-current');
  });

  [[english, 'en', currentPage], [turkish, 'tr', 'tr/' + currentPage]].forEach(([link, lang, path]) => {
    link.href = new URL(path, root).href;
    link.lang = lang;
    link.hreflang = lang;
    link.classList.add('language-link');
    link.classList.toggle('active', lang === (isTurkish ? 'tr' : 'en'));
    link.removeAttribute('aria-current');
    if (lang === (isTurkish ? 'tr' : 'en')) link.setAttribute('aria-current', 'true');
    const alternate = document.createElement('link');
    alternate.rel = 'alternate';
    alternate.hreflang = lang;
    alternate.href = link.href;
    document.head.appendChild(alternate);
  });

  const toggle = document.querySelector('.navbar-toggler');
  if (isTurkish && toggle) toggle.setAttribute('aria-label', 'Gezinme menüsünü aç/kapat');

  document.addEventListener('DOMContentLoaded', () => {
    const notice = document.querySelector('#termsfeed-com---nb .cc-nb-text');
    if (notice) notice.textContent = isTurkish
      ? 'İzin verirseniz Google Analytics çerezleriyle ziyaret kaynaklarını, görüntülenen sayfaları ve site içindeki etkileşimleri ölçüyoruz. Analiz çerezlerini kabul edebilir, reddedebilir veya tercihlerinizi değiştirebilirsiniz.'
      : 'With your permission, Google Analytics cookies help us measure traffic sources, page views and interactions with this website. You can accept or reject analytics cookies, or change your preferences.';
    const preferences = document.getElementById('open_preferences_center');
    if (preferences) preferences.textContent = isTurkish ? 'Çerez tercihleri' : 'Cookie preferences';
  }, { once: true });
})();
</script>
